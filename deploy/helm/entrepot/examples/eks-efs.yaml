# Highly available: several replicas sharing an EFS volume (ReadWriteMany).
replicaCount: 3
baseURL: https://entrepot.example.com
database:
  existingSecret: entrepot-db
auth:
  existingSecret: entrepot-auth        # session-secret (shared by replicas), oidc-client-secret, ...
blobStores:
  - name: default
    type: file
    volume:
      storageClass: efs-sc             # EFS CSI driver StorageClass
      accessMode: ReadWriteMany
      size: 1Ti                        # EFS ignores the size but Kubernetes requires one
podDisruptionBudget:
  enabled: true
  minAvailable: 2
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels: {app.kubernetes.io/name: entrepot}
