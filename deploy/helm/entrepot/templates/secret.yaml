{{- $fullname := include "entrepot.fullname" . }}
{{- if not .Values.auth.existingSecret }}
{{- $name := printf "%s-auth" $fullname }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "entrepot.labels" . | nindent 4 }}
type: Opaque
stringData:
  session-secret: {{ include "entrepot.secretValue" (dict "ctx" . "name" $name "key" "session-secret" "value" .Values.auth.sessionSecret "len" 48) | quote }}
  {{- if .Values.auth.bootstrapToken }}
  bootstrap-token: {{ .Values.auth.bootstrapToken | quote }}
  {{- end }}
  {{- if .Values.auth.oidc.clientSecret }}
  oidc-client-secret: {{ .Values.auth.oidc.clientSecret | quote }}
  {{- end }}
{{- end }}
{{- if not .Values.database.existingSecret }}
---
{{- $dbName := printf "%s-db" $fullname }}
{{- $url := .Values.database.url }}
{{- if .Values.postgresql.enabled }}
{{- $pw := include "entrepot.secretValue" (dict "ctx" . "name" $dbName "key" "postgres-password" "value" .Values.postgresql.password "len" 24) }}
{{- $url = printf "postgres://%s:%s@%s-postgresql:5432/%s?sslmode=disable" .Values.postgresql.username $pw $fullname .Values.postgresql.database }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbName }}
  labels:
    {{- include "entrepot.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ $pw | quote }}
  {{ .Values.database.existingSecretKey }}: {{ $url | quote }}
{{- else }}
{{- if not $url }}
{{- fail "database.url (or database.existingSecret, or postgresql.enabled=true) is required" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbName }}
  labels:
    {{- include "entrepot.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ $url | quote }}
{{- end }}
{{- end }}
