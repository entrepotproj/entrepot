{{- $stores := list }}
{{- range .Values.blobStores }}
{{- if eq .type "file" }}
{{- $stores = append $stores (dict "name" .name "type" "file" "path" (printf "/data/%s" .name)) }}
{{- else if eq .type "s3" }}
{{- $s3 := dict }}
{{- range $k, $v := .s3 }}
{{- $_ := set $s3 $k (toString $v) }}
{{- end }}
{{- $stores = append $stores (dict "name" .name "type" "s3" "s3" $s3) }}
{{- else }}
{{- fail (printf "blobStores[%s]: type must be file or s3" .name) }}
{{- end }}
{{- end }}
{{- $oidc := omit .Values.auth.oidc "clientSecret" }}
{{- $gitlab := list }}
{{- range .Values.auth.gitlab }}
{{- $g := dict "name" .name "issuerURL" .issuerURL }}
{{- with .audience }}{{- $_ := set $g "audience" . }}{{- end }}
{{- if or .apiToken .feedback }}
{{- $_ := set $g "api" (dict "url" (default .issuerURL .apiURL) "tokenEnv" (include "entrepot.gitlabTokenEnv" .name)) }}
{{- end }}
{{- $gitlab = append $gitlab $g }}
{{- end }}
{{- $workers := .Values.scanning.workers }}
{{- if .Values.scanning.worker.enabled }}{{- $workers = 0 }}{{- end }}
{{- $cfg := dict
  "server" (dict "addr" ":8080" "baseURL" .Values.baseURL "trustForwardedHeaders" true)
  "database" (dict "maxConns" .Values.database.maxConns "autoMigrate" true)
  "auth" (dict
      "anonymousAccess" .Values.auth.anonymousAccess
      "adminGroups" .Values.auth.adminGroups
      "adminUsers" .Values.auth.adminUsers
      "oidc" $oidc
      "gitlab" $gitlab)
  "storage" (dict "allowedRoots" (list "/data") "tempDir" "/tmp")
  "blobStores" $stores
  "log" .Values.log
  "scan" (dict "workers" $workers "workDir" "/tmp" "jobTimeout" .Values.scanning.jobTimeout)
  "cleanup" (dict "interval" .Values.cleanup.interval)
}}
{{- $cfg = mergeOverwrite $cfg .Values.config }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "entrepot.fullname" . }}
  labels:
    {{- include "entrepot.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml $cfg | nindent 4 }}
