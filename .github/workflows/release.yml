name: Release

# Publishes a release: the server and scanner images, the Helm chart, and the
# GitHub release itself. release-please.yml calls this after a release PR is
# merged, with the draft release it created. The release stays a draft until
# everything is pushed, so it never appears without its chart attached.
#
# Run it by hand ("Run workflow", with the tag) to:
# * publish the version in .release-please-manifest.json when it has no
#   release yet (the first release, 0.1.0). The notes come from its
#   CHANGELOG.md section;
# * finish a draft release whose publish job didn't complete.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.0
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        type: string
        required: true

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Draft release and tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::'$TAG' is not a release tag like v1.2.3"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"

          if gh release view "$TAG" --json isDraft,targetCommitish > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            if [ "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" != true ]; then
              echo "::error::Release $TAG is already published."
              exit 1
            fi
            target="$(jq -r .targetCommitish "$RUNNER_TEMP/release.json")"
          else
            # No release yet. Only the version the manifest records may be
            # published this way, so release-please stays in step.
            manifest="$(jq -r '."."' .release-please-manifest.json)"
            if [ "$version" != "$manifest" ]; then
              echo "::error::$TAG has no release, and .release-please-manifest.json is at $manifest. Merge the release PR instead."
              exit 1
            fi
            # The CHANGELOG.md section for this version, up to the next version
            # heading: "## 1.2.3", "## [1.2.3](...) (date)" or "### [1.2.3](...)".
            awk -v v="$version" '
              /^###? \[?v?[0-9]/ { if (found) exit; h = $0; sub(/^###? \[?v?/, "", h); sub(/[^0-9A-Za-z.+-].*$/, "", h); if (h == v) { found = 1; next } }
              found { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
            if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
              echo "::error::CHANGELOG.md has no section for $version."
              exit 1
            fi
            target="$GITHUB_SHA"
            gh release create "$TAG" --draft --title "$TAG" --target "$target" --notes-file "$RUNNER_TEMP/notes.md"
          fi

          sha="$(git rev-parse --verify "$target^{commit}" 2>/dev/null || git rev-parse --verify "origin/$target^{commit}")"
          # release-please creates the tag with the draft (force-tag-creation);
          # create it here if it doesn't exist, so later jobs can check it out.
          remote="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n 1 | cut -f 1)"
          if [ -z "$remote" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$sha" > /dev/null
          elif [ "$remote" != "$sha" ]; then
            echo "::error::Tag $TAG points at $remote, but the release targets $sha."
            exit 1
          fi
          echo "Publishing $TAG ($sha)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  images:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata (server)
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: git
          images: ghcr.io/${{ github.repository_owner }}/entrepot
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest
      - name: Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ inputs.tag }}
      - name: Metadata (scanner)
        id: meta-scanner
        uses: docker/metadata-action@v5
        with:
          context: git
          images: ghcr.io/${{ github.repository_owner }}/entrepot-scanner
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest
      - name: Scanner image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: scanner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-scanner.outputs.tags }}
          labels: ${{ steps.meta-scanner.outputs.labels }}
          build-args: VERSION=${{ inputs.tag }}

  chart:
    runs-on: ubuntu-latest
    needs: [prepare, images]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: azure/setup-helm@v4
      - name: Package and push chart (OCI)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          helm package deploy/helm/entrepot --version "$VERSION" --app-version "$VERSION"
          echo "$REGISTRY_PASSWORD" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "entrepot-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts"
      - name: Attach the chart to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "$TAG" "entrepot-$VERSION.tgz" --clobber

  publish:
    runs-on: ubuntu-latest
    needs: chart
    steps:
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false
