name: Release

# Every push to main runs CI, then semantic-release. When the commits since
# the last v* tag include a fix, a feature or a breaking change, it tags the
# next version and creates the GitHub release; the images and the chart are
# then built from that tag. See docs/releasing.md.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
    outputs:
      published: ${{ steps.semrel.outputs.published }}
      version: ${{ steps.semrel.outputs.version }}
      tag: ${{ steps.semrel.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: semantic-release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/exec@7.1.0
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release

  images:
    runs-on: ubuntu-latest
    # Normally about 10 minutes; a hung build fails instead of running for 6 hours.
    timeout-minutes: 60
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata (server)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/entrepot
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest
      - name: Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.release.outputs.tag }}
      - name: Metadata (scanner)
        id: meta-scanner
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/entrepot-scanner
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest
      - name: Scanner image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: scanner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-scanner.outputs.tags }}
          labels: ${{ steps.meta-scanner.outputs.labels }}
          build-args: VERSION=${{ needs.release.outputs.tag }}

  chart:
    runs-on: ubuntu-latest
    needs: [release, images]
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: azure/setup-helm@v4
      - name: Package and push chart (OCI)
        run: |
          helm package deploy/helm/entrepot --version "$VERSION" --app-version "$VERSION"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "entrepot-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
      - name: Attach chart to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "entrepot-$VERSION.tgz" --clobber
