name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generated code is up to date
        run: |
          (cd api && go generate ./...)
          git diff --exit-code -- internal/api/apigen pkg/client
      - name: Lint
        run: make lint
      - name: Test
        run: make test TEST_DATABASE_URL="postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: API types are up to date
        run: npm run gen:api && git diff --exit-code -- src/api
      - run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: make helm-lint

  image-and-kind:
    runs-on: ubuntu-latest
    needs: [go, web, helm]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: entrepot:ci
          build-args: VERSION=${{ github.sha }}
      - name: Build scanner image (trivy + grype)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: scanner
          load: true
          tags: entrepot-scanner:ci
          build-args: VERSION=${{ github.sha }}
      - name: Scanner image has trivy and grype
        run: |
          docker run --rm --entrypoint trivy entrepot-scanner:ci --version
          docker run --rm --entrypoint grype entrepot-scanner:ci version
      - uses: helm/kind-action@v1
        with:
          cluster_name: entrepot
      - uses: azure/setup-helm@v4
      - name: Install chart
        run: |
          kind load docker-image entrepot:ci --name entrepot
          helm install entrepot deploy/helm/entrepot \
            --set image.repository=entrepot --set image.tag=ci --set image.pullPolicy=Never \
            --set postgresql.enabled=true --set baseURL=http://localhost:8080 \
            --set auth.bootstrapToken=ci-token --wait --timeout 5m
      - name: Smoke test
        run: |
          kubectl port-forward svc/entrepot 8080:80 &
          sleep 5
          T=ci-token
          curl -fsS localhost:8080/readyz
          curl -fsS -H "Authorization: Bearer $T" -H 'Content-Type: application/json' \
            -X POST localhost:8080/api/v1/repositories \
            -d '{"name":"files","format":"raw","kind":"hosted","blobStore":"default"}'
          echo hello > hello.txt
          curl -fsS -H "Authorization: Bearer $T" -T hello.txt localhost:8080/repository/files/hello.txt
          test "$(curl -fsS -H "Authorization: Bearer $T" localhost:8080/repository/files/hello.txt)" = hello
      - name: Debug on failure
        if: failure()
        run: kubectl get all -A; kubectl logs deploy/entrepot --tail=200 || true
